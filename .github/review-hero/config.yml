project: bestool
description: a Rust workspace of cross-platform CLI tools and daemons for BES deployment and ops tasks

# Added to the built-in defaults (Cargo.lock and friends are already stripped).
ignore_patterns:
  # Generated by update-usage.sh from each binary's `_docs` output.
  - "crates/*/USAGE.md"
  # Vendored from Workhorse releases, not hand-written.
  - ".agents/**"
