name: CI

on:
  workflow_dispatch:
  merge_group:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  CARGO_UNSTABLE_SPARSE_REGISTRY: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

# Cache strategy (the `with:` on every rust-cache step below). The repo has a
# 10 GB cache cap, so we keep the footprint small:
#   - shared-key: every job builds the same workspace, so they share one cache
#     per OS/arch (rust-cache appends those) rather than a cache each.
#   - save-if: only the default branch writes the cache; PRs and the merge queue
#     restore it read-only, so branches don't evict each other and rebuild cold.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - macos-latest
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-latest

    name: ${{ matrix.platform }} / test
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Configure toolchain
        run: |
          rustup toolchain install --profile minimal --no-self-update stable
          rustup default stable

      # https://github.com/actions/cache/issues/752
      - if: runner.os == 'Windows'
        name: Use GNU tar
        shell: cmd
        run: |
          echo "Adding GNU tar to PATH"
          echo C:\Program Files\Git\usr\bin>>"%GITHUB_PATH%"

      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl musl-dev musl-tools gcc-aarch64-linux-gnu
          rustup target add x86_64-unknown-linux-musl
          rustup target add aarch64-unknown-linux-gnu
          rustup target add aarch64-unknown-linux-musl

      - if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2.86.2
        with:
          tool: cross

      - if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin

      - uses: ikalnytskyi/action-setup-postgres@v8
        id: postgres
        with:
          username: ci
          database: ci
          ssl: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test
        env:
          DATABASE_URL: ${{ steps.postgres.outputs.connection-uri }}

  contract:
    name: Canopy contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Configure toolchain
        run: |
          rustup toolchain install --profile minimal --no-self-update stable
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Contract tests against live canopy
        run: cargo test -p bestool --lib canopy_contract -- --ignored

  alertd-alone:
    name: alertd / builds without Tamanu
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Configure toolchain
        run: |
          rustup toolchain install --profile minimal --no-self-update stable
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The daemon is meant to run on hosts with no Tamanu deployment, so the
      # `alertd` feature has to stand on its own. It pulls several optional
      # deps that the default build gets via `tamanu`, and nothing else in CI
      # builds this combination.
      - name: Check the alertd feature on its own
        run: cargo check -p bestool --no-default-features --features alertd --all-targets

  alertd-no-db:
    name: alertd / graceful without postgres
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Configure toolchain
        run: |
          rustup toolchain install --profile minimal --no-self-update stable
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build alertd tests
        run: cargo test -p bestool-alertd --lib --no-run --message-format=json > alertd-tests.json
      - name: Run doctor checks in a postgres-less network namespace
        run: |
          set -euo pipefail
          bin=$(jq -r 'select(.reason == "compiler-artifact" and (.target.kind == ["lib"]) and .executable != null and (.package_id | test("bestool-alertd"))) | .executable' alertd-tests.json | tail -n1)
          test -n "$bin" || { echo "could not locate alertd lib test binary"; exit 1; }
          echo "running doctor checks in a fresh network namespace: $bin"
          # A new network namespace has no route to the host's postgres, so the
          # doctor checks must degrade gracefully (db_connect alerts, DB-backed
          # checks skip) rather than hang or panic. `sudo unshare` runs as real
          # root, sidestepping ubuntu 24.04's restriction on unprivileged user
          # namespaces. The crate is checks-only — the daemon and its HTTP server
          # live in bestool — so the whole lib test binary runs here.
          sudo unshare --net -- bash -c "ip link set lo up && exec '$bin'"

  podman-secret:
    name: secret key / podman e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Configure toolchain
        run: |
          rustup toolchain install --profile minimal --no-self-update stable
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # A containerised install keeps the key as a podman secret, so the capture
      # and restore both go through podman rather than the filesystem.
      - name: Podman secret round trip and clobber gate
        run: cargo test -p bestool --lib secret_key::tests -- --ignored --nocapture

  btrfs-hold:
    name: btrfs hold / e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Configure toolchain
        run: |
          rustup toolchain install --profile minimal --no-self-update stable
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: sudo apt-get update && sudo apt-get install -y btrfs-progs postgresql

      # The snapshot backends idmap their read-only mount from the postgres user
      # to the kopia one, so both accounts have to exist for a capture to be taken.
      - name: Create the kopia user
        run: id -u kopia >/dev/null 2>&1 || sudo useradd --system --user-group --no-create-home kopia

      # The hold's record and held-source directories are system ones, and the
      # storage needs mounting, neither of which `cargo test` can do: build the
      # test binary first, then run it under sudo.
      - name: Build the test binary
        run: |
          binary=$(cargo test --no-run -p bestool --lib --message-format=json \
            | jq -r 'select(.profile.test == true) | .executable // empty' | head -n1)
          test -n "$binary"
          echo "HOLD_TEST_BINARY=$binary" >> "$GITHUB_ENV"

      - name: Reattach a held btrfs capture
        run: sudo "$HOLD_TEST_BINARY" btrfs::e2e --ignored --nocapture --test-threads=1

      # The sequence an operator runs, against a real cluster on a real btrfs
      # subvolume: take a capture-only hold, read the listing, restore from it,
      # reattach it, drop it.
      - name: The hold lifecycle on btrfs
        run: sudo "$HOLD_TEST_BINARY" hold::e2e::unix::a_btrfs --ignored --nocapture --test-threads=1

  lvm-hold:
    name: thin-lvm hold / e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Configure toolchain
        run: |
          rustup toolchain install --profile minimal --no-self-update stable
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: sudo apt-get update && sudo apt-get install -y lvm2 thin-provisioning-tools postgresql

      # The snapshot backends idmap their read-only mount from the postgres user
      # to the kopia one, so both accounts have to exist for a capture to be taken.
      - name: Create the kopia user
        run: id -u kopia >/dev/null 2>&1 || sudo useradd --system --user-group --no-create-home kopia

      # The hold's record and held-source directories are system ones, and the
      # storage needs mounting, neither of which `cargo test` can do: build the
      # test binary first, then run it under sudo.
      - name: Build the test binary
        run: |
          binary=$(cargo test --no-run -p bestool --lib --message-format=json \
            | jq -r 'select(.profile.test == true) | .executable // empty' | head -n1)
          test -n "$binary"
          echo "HOLD_TEST_BINARY=$binary" >> "$GITHUB_ENV"

      # The pool is deliberately small, so the ballast the capture pins is a
      # legible share of it and a drop that only forgot the record is visible.
      - name: The hold lifecycle on thin-LVM
        run: sudo "$HOLD_TEST_BINARY" hold::e2e::unix::a_thin_lvm --ignored --nocapture --test-threads=1

  basebackup-hold:
    name: base backup hold / e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Configure toolchain
        run: |
          rustup toolchain install --profile minimal --no-self-update stable
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: sudo apt-get update && sudo apt-get install -y postgresql

      # The snapshot backends idmap their read-only mount from the postgres user
      # to the kopia one, so both accounts have to exist for a capture to be taken.
      - name: Create the kopia user
        run: id -u kopia >/dev/null 2>&1 || sudo useradd --system --user-group --no-create-home kopia

      # The hold's record and held-source directories are system ones, and the
      # storage needs mounting, neither of which `cargo test` can do: build the
      # test binary first, then run it under sudo.
      - name: Build the test binary
        run: |
          binary=$(cargo test --no-run -p bestool --lib --message-format=json \
            | jq -r 'select(.profile.test == true) | .executable // empty' | head -n1)
          test -n "$binary"
          echo "HOLD_TEST_BINARY=$binary" >> "$GITHUB_ENV"

      # No privileged storage is involved in the capture itself, but the hold's
      # record and held-source directories are system ones, so this still runs as
      # root rather than in the ordinary test job. It is also the one backend that
      # exposes nothing separately, so its reattach must refuse rather than no-op.
      - name: The hold lifecycle on a base backup
        run: sudo "$HOLD_TEST_BINARY" hold::e2e::unix::a_base_backup --ignored --nocapture --test-threads=1

  kopia-proxy:
    name: kopia S3 proxy / e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Configure toolchain
        run: |
          rustup toolchain install --profile minimal --no-self-update stable
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin123 \
            quay.io/minio/minio:latest server /data
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then echo "minio ready"; break; fi
            sleep 1
          done
      - name: Create bucket
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin123
          AWS_DEFAULT_REGION: us-east-1
        run: aws --endpoint-url http://127.0.0.1:9000 s3 mb s3://kopia-proxy-ci
      - name: Install kopia
        run: |
          curl -fsSL https://github.com/kopia/kopia/releases/download/v0.23.1/kopia-0.23.1-linux-x64.tar.gz -o kopia.tgz
          tar xzf kopia.tgz
          echo "KOPIA_BIN=$PWD/kopia-0.23.1-linux-x64/kopia" >> "$GITHUB_ENV"
      - name: Run proxy end-to-end test
        env:
          KOPIA_PROXY_TEST_ENDPOINT: http://127.0.0.1:9000
          KOPIA_PROXY_TEST_BUCKET: kopia-proxy-ci
          KOPIA_PROXY_TEST_ACCESS_KEY: minioadmin
          KOPIA_PROXY_TEST_SECRET_KEY: minioadmin123
          KOPIA_PROXY_TEST_REGION: us-east-1
        run: cargo test -p bestool-kopia --features proxy --test proxy_e2e -- --ignored --nocapture

  vss-wmi:
    name: vss / wmi e2e
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Configure toolchain
        run: |
          rustup toolchain install --profile minimal --no-self-update stable
          rustup default stable
      # https://github.com/actions/cache/issues/752
      - name: Use GNU tar
        shell: cmd
        run: echo C:\Program Files\Git\usr\bin>>"%GITHUB_PATH%"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install kopia
        shell: pwsh
        run: |
          curl.exe -fsSL https://github.com/kopia/kopia/releases/download/v0.23.1/kopia-0.23.1-windows-x64.zip -o kopia.zip
          Expand-Archive -Path kopia.zip -DestinationPath kopia
          $exe = (Get-ChildItem -Path kopia -Recurse -Filter kopia.exe | Select-Object -First 1).FullName
          "KOPIA_BIN=$exe" >> $env:GITHUB_ENV
      # Creates a real VSS shadow via WMI and has kopia snapshot its GLOBALROOT
      # device path — validating the VSS backend end-to-end on a real Windows host.
      - name: WMI VSS end-to-end
        run: cargo test -p bestool --lib wmi_shadow_roundtrip -- --ignored --nocapture

      # A follower reading its source out of the leader's shadow: the data is
      # rewritten after the freeze, so serving live bytes fails the test.
      - name: Shared volume capture end-to-end
        run: cargo test -p bestool --lib a_shared_capture_reads_the_bytes_from_when_it_froze -- --ignored --nocapture

      # A secret-key follower of a VSS leader: its staged copy is made after the
      # freeze, so reading through the leader's capture would serve the old key.
      - name: Secret key follower end-to-end
        run: cargo test -p bestool --lib a_secret_key_follower_reads_its_key_live -- --ignored --nocapture

      # The lifecycle restores into the host's own cluster, so it has to be up
      # first: the image ships the service stopped and disabled.
      - name: Start the host postgres cluster
        shell: pwsh
        run: |
          $service = Get-Service postgresql-x64-* | Select-Object -First 1
          if (-not $service) { throw "no postgres service on this image" }
          Set-Service -Name $service.Name -StartupType Automatic
          Start-Service -Name $service.Name
          & "$env:PGBIN\pg_isready.exe" -h 127.0.0.1

      # The steps above exercise the pieces of a VSS capture. These exercise the
      # sequence an operator runs — take a capture-only hold, read the listing,
      # restore from it, reattach it, drop it — which nothing did, and which is
      # how a hold that reported detached from the moment it was taken shipped.
      # The second test covers what a reboot does to a junction, by pointing one
      # at a device number VSS has not handed out.
      - name: The hold lifecycle on VSS
        run: cargo test -p bestool --lib hold::e2e::windows -- --ignored --nocapture --test-threads=1

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Configure toolchain
        run: |
          rustup toolchain install --profile minimal --no-self-update stable
          rustup default stable
          rustup component add clippy
      - uses: taiki-e/install-action@v2.86.2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets --all-features

  check-docs:
    name: Check USAGE.md files are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Configure toolchain
        run: |
          rustup toolchain install --profile minimal --no-self-update stable
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Generate USAGE.md files
        run: ./update-usage.sh
      - name: Check for changes
        run: |
          if ! git diff --exit-code crates/*/USAGE.md; then
            echo "Error: USAGE.md files are out of date!"
            echo "Run ./update-usage.sh and commit the changes."
            exit 1
          fi

  tests-pass:
    if: always()
    name: Tests pass
    needs: [test, contract, check-docs, alertd-alone, alertd-no-db, kopia-proxy, podman-secret, vss-wmi, btrfs-hold, lvm-hold, basebackup-hold]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
