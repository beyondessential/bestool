[default]
# Spec ids are short uppercase codes, not words.
extend-ignore-re = [
  "(?m)^id: [A-Z][A-Z0-9-]*$",
  "spec: [A-Z][A-Z0-9-]*",
  "\\[[A-Z][A-Z0-9-]*\\]\\([^)]*\\.md",
  # Colon-separated hex, as certificate fingerprints are written.
  "(?:[0-9A-Fa-f]{2}:){7,}[0-9A-Fa-f]{2}",
]

[files]
extend-exclude = ["CHANGELOG.md", "crates/psql/EXAMPLES.md"]

[default.extend-words]
larg = "larg" # left arg (in parsers)
MIGH = "MIGH" # base64 PEM data in tests
unparseable = "unparseable" # incredibly common typo and honestly idgaf
invokable = "invokable" # Workhorse-managed wording (AGENTS.md, skills)
HPE = "HPE" # server vendor, as it appears in SMBIOS
