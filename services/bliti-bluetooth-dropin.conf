# Install to /etc/systemd/system/bluetooth.service.d/10-bliti.conf
#
# Points bluetoothd at bliti's own config rather than editing
# /etc/bluetooth/main.conf, which belongs to the bluez package: editing it
# means a conffile prompt on every upgrade, and the change is invisible to
# anyone reading this repository. Undoing this is deleting two files.
#
# The path to the daemon is spelled out because overriding ExecStart requires
# it, and it differs between distributions (/usr/libexec on Debian and Ubuntu,
# /usr/lib elsewhere). If a bluez upgrade moves it, bluetooth.service fails to
# start and says so, rather than quietly reverting to main.conf.
[Service]
ExecStart=
ExecStart=/usr/libexec/bluetooth/bluetoothd --configfile=/etc/bluetooth/bliti.conf
