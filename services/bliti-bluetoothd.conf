# Install to /etc/bluetooth/bliti.conf, and load it with the companion
# bluetooth.service drop-in (services/bliti-bluetooth-dropin.conf).
#
# bliti needs bluetoothd to be peripheral-only, which is specified in BLI-CHN,
# "The device is a peripheral only". Without it bluetoothd resolves the
# connecting client's GATT database in turn, meets an attribute whose read
# wants an encrypted link, asks to pair, is refused (no client this protocol
# serves can pair), and drops the link partway through a working session.
#
# This file is loaded *instead of* main.conf, not merged with it, so anything
# absent here takes bluetoothd's built-in default. That is what a stock
# main.conf gives anyway: it ships with every setting commented out. If a
# deployment ever needs a setting from main.conf, it belongs here too.
[General]
ReverseServiceDiscovery = false

[GATT]
Client = false
