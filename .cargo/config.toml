# getrandom needs to be told which backend to use on wasm: the feature alone is not enough, it also
# wants this cfg. Scoped to the wasm target, so no native build sees it. `bliti-web` is the crate
# that needs it, by way of snow's random number generation.
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']
