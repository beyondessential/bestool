<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bliti</title>
<style>
:root {
	--page: #fbfbfa;
	--surface: #ffffff;
	--line: #e4e2dd;
	--text: #1c1917;
	--muted: #57534e;
	--accent: #1d4ed8;
	--bad: #b91c1c;
	--good: #15803d;
}
* { box-sizing: border-box; }
body {
	margin: 0;
	padding: 16px;
	background: var(--page);
	color: var(--text);
	font: 16px/1.5 system-ui, sans-serif;
}
main { max-width: 34rem; margin: 0 auto; }
h1 { font-size: 1.25rem; margin: 0 0 16px; }
section {
	background: var(--surface);
	border: 1px solid var(--line);
	border-radius: 8px;
	padding: 16px;
	margin-bottom: 12px;
}
section[hidden] { display: none; }
h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 12px; }
button {
	font: inherit;
	padding: 12px 16px;
	min-height: 44px;
	border: 0;
	border-radius: 6px;
	background: var(--accent);
	color: #fff;
	cursor: pointer;
}
button:disabled { background: var(--muted); opacity: 0.5; cursor: default; }
button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--line); }
input, textarea {
	font: inherit;
	width: 100%;
	padding: 12px;
	border: 1px solid var(--line);
	border-radius: 6px;
	background: var(--page);
	color: var(--text);
}
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { flex: 1 1 auto; }
.code { font-family: ui-monospace, monospace; font-size: 0.85rem; word-break: break-all; }
.muted { color: var(--muted); font-size: 0.9rem; }
.bad { color: var(--bad); }
.good { color: var(--good); }
dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; }
dt { color: var(--muted); font-size: 0.9rem; }
dd { margin: 0; }
video { width: 100%; border-radius: 6px; background: #000; }
#log { max-height: 9rem; overflow-y: auto; }
#log p { margin: 0 0 4px; }
</style>
</head>
<body>
<main>
<h1>bliti</h1>

<section id="unsupported" hidden>
	<h2>Not available</h2>
	<p id="unsupported-why" class="bad"></p>
</section>

<section id="read">
	<h2>Sticker</h2>
	<p class="muted">Scan the code on the device, or type the letters printed under it.</p>
	<div class="row">
		<input id="typed" placeholder="AHFY-TP4T-..." autocomplete="off" autocapitalize="characters" spellcheck="false">
		<button id="use-typed">Use</button>
	</div>
	<div class="row" style="margin-top: 8px">
		<button id="scan" class="secondary" hidden>Scan with camera</button>
	</div>
	<video id="preview" hidden playsinline muted></video>
	<p id="read-error" class="bad"></p>
</section>

<section id="found" hidden>
	<h2>Sticker read</h2>
	<p class="code" id="found-human"></p>
	<div class="row">
		<button id="connect">Find the device</button>
		<button id="forget" class="secondary">Use another sticker</button>
	</div>
	<p id="connect-status" class="muted"></p>
</section>

<section id="session" hidden>
	<h2>Device</h2>
	<dl id="identity"></dl>
	<div class="row" style="margin-top: 12px">
		<input id="text" placeholder="Text for the device to print" autocomplete="off">
		<button id="send">Send</button>
	</div>
	<p id="send-status" class="muted"></p>
</section>

<section id="log-section" hidden>
	<h2>Activity</h2>
	<div id="log" class="muted"></div>
</section>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
