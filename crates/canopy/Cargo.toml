[package]
name = "bestool-canopy"
version = "0.7.11"
edition = "2024"
authors = ["Félix Saparelli <felix@passcod.name>", "BES Developers <contact@bes.au>"]
license = "GPL-3.0-or-later"
description = "(Internal) BES tooling: Canopy client"
repository = "https://github.com/beyondessential/bestool/tree/main/crates/canopy"
exclude.workspace = true

[features]
default = []
# Exposes the generic escape-hatch methods (`get`, `request`) on `ReqwestTransport`.
# Off by default: prefer the generated per-endpoint methods.
raw-requests = []

[lints]
workspace = true

[dependencies]
algae-cli = { version = "1.1.11", path = "../algae-cli" }
async-trait = "0.1.89"
base64 = "0.23.0"
bes-canopy-api = "1.0.0"
blake3 = "1.8.5"
futures = { workspace = true, features = ["executor"] }
getrandom = "0.4.2"
hickory-resolver = "0.26.1"
http = "1.4.2"
jiff = { version = "0.2.28", features = ["serde"] }
machine-uid = "0.6.0"
miette = { workspace = true }
rcgen = { workspace = true }
reqwest = { workspace = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sysinfo = { workspace = true }
time = "0.3"
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true }
uuid = { version = "1.23.2", features = ["serde"] }

[dev-dependencies]
tempfile = "3.21.0"
